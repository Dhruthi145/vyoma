<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VYOMA FARMS — Launching Soon</title>
<meta name="description" content="VYOMA FARMS — Engaged in Agriculture and LiveStock Farming. Launching soon.">
<meta name="theme-color" content="#263D2B">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">

<style>
  :root{
    --forest:#263D2B;
    --olive:#596B42;
    --beige:#EDE6D5;
    --gold:#B69A60;
    --ivory:#FAF8F0;
    --gold-soft:#D3BC87;
    --serif:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--forest);
    color:var(--ivory);
    font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }

  /* ---------- Photographic background (one continuous full-page composition) ---------- */
  .scene{
    position:fixed;inset:0;z-index:0;overflow:hidden;
    background:linear-gradient(180deg,#3a4a30 0%,var(--olive) 45%,var(--forest) 100%);
  }
  .slide{
    position:absolute;inset:-2%;
    background-size:cover;background-position:center;background-repeat:no-repeat;
    opacity:0;
    animation:fade 12s infinite, drift 12s infinite ease-in-out;
    filter:saturate(.95) contrast(1.02) brightness(1.02);
    will-change:opacity,transform;
  }
  .slide:nth-child(1){
    background-image:url("https://images.pexels.com/photos/36667212/pexels-photo-36667212/free-photo-of-scenic-countryside-landscape-with-grazing-cows.jpeg?auto=compress&cs=tinysrgb&w=2000");
    animation-delay:0s;
  }
  .slide:nth-child(2){animation-delay:4s}
  .half{
    position:absolute;top:0;bottom:0;width:55%;
    background-size:cover;background-position:center;background-repeat:no-repeat;
  }
  .half.a{
    left:0;
    background-image:url("https://images.pexels.com/photos/19972937/pexels-photo-19972937/free-photo-of-hens-in-the-chicken-coop.jpeg?auto=compress&cs=tinysrgb&w=1600");
    -webkit-mask-image:linear-gradient(90deg,#000 78%,transparent 100%);
            mask-image:linear-gradient(90deg,#000 78%,transparent 100%);
  }
  .half.b{
    right:0;
    background-image:url("https://images.pexels.com/photos/10041325/pexels-photo-10041325.jpeg?auto=compress&cs=tinysrgb&w=1600");
    -webkit-mask-image:linear-gradient(270deg,#000 78%,transparent 100%);
            mask-image:linear-gradient(270deg,#000 78%,transparent 100%);
  }
  @media (max-width:700px){
    .half{left:0;right:0;width:auto;height:55%;top:auto;bottom:auto}
    .half.a{top:0;-webkit-mask-image:linear-gradient(180deg,#000 78%,transparent 100%);mask-image:linear-gradient(180deg,#000 78%,transparent 100%)}
    .half.b{bottom:0;-webkit-mask-image:linear-gradient(0deg,#000 78%,transparent 100%);mask-image:linear-gradient(0deg,#000 78%,transparent 100%)}
  }
  .slide:nth-child(3){
    background-image:url("https://images.pexels.com/photos/4483610/pexels-photo-4483610.jpeg?auto=compress&cs=tinysrgb&w=2000");
    animation-delay:8s;
  }
  @keyframes fade{
    0%{opacity:0}
    8%{opacity:1}
    33%{opacity:1}
    41%{opacity:0}
    100%{opacity:0}
  }
  @keyframes drift{
    0%{transform:scale(1.02) translate3d(0,0,0)}
    41%{transform:scale(1.05) translate3d(-.6%,-.3%,0)}
    100%{transform:scale(1.05) translate3d(-.6%,-.3%,0)}
  }

  /* Overlay: deep forest green + warm cream wash, blends everything into one tone */
  .overlay{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(ellipse 60% 52% at 50% 50%, rgba(24,40,28,.55) 0%, rgba(24,40,28,.25) 60%, rgba(24,40,28,0) 100%),
      linear-gradient(180deg, rgba(38,61,43,.55) 0%, rgba(38,61,43,.40) 40%, rgba(38,61,43,.44) 70%, rgba(24,40,28,.68) 100%),
      linear-gradient(rgba(89,107,66,.14), rgba(89,107,66,.14));
  }
  .vignette{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 60%, rgba(18,30,21,.28) 100%);
  }
  .grain{
    position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- Content ---------- */
  main{
    position:relative;z-index:4;
    min-height:100vh;min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:clamp(2.5rem,7vh,5rem) clamp(1.25rem,5vw,4rem);
    padding-top:max(clamp(2.5rem,7vh,5rem),env(safe-area-inset-top,0px));
    padding-bottom:max(clamp(2.5rem,7vh,5rem),env(safe-area-inset-bottom,0px));
  }

  .brand{
    font-weight:700;
    text-transform:uppercase;
    font-size:clamp(2.4rem,9vw,6.5rem);
    line-height:.95;
    letter-spacing:.08em;
    margin-right:-.08em; /* optically centre despite trailing letter-spacing */
    color:var(--ivory);
    text-shadow:0 2px 6px rgba(18,30,21,.5),0 4px 36px rgba(18,30,21,.7);
  }

  .farms-row{
    display:flex;align-items:center;justify-content:center;
    gap:clamp(.9rem,2.6vw,2rem);
    margin-top:clamp(.6rem,2vh,1.2rem);
    width:100%;
  }
  .farms-row .line{
    flex:0 1 clamp(40px,12vw,170px);
    height:1px;
    background:linear-gradient(90deg,transparent,var(--gold));
  }
  .farms-row .line.r{background:linear-gradient(270deg,transparent,var(--gold))}
  .farms{
    font-weight:600;
    text-transform:uppercase;
    font-size:clamp(.95rem,2.8vw,1.8rem);
    letter-spacing:.62em;
    margin-right:-.62em;
    color:var(--gold-soft);
    text-shadow:0 2px 18px rgba(18,30,21,.5);
  }

  .tagline{
    margin-top:clamp(1.6rem,4.5vh,2.8rem);
    font-style:italic;
    font-weight:500;
    font-size:clamp(.78rem,4vw,1.35rem);
    letter-spacing:.02em;
    white-space:nowrap;
    color:var(--beige);
    text-shadow:0 1px 4px rgba(18,30,21,.7),0 2px 18px rgba(18,30,21,.7);
  }

  /* ---------- LAUNCHING SOON : main highlight ---------- */
  .launch{
    margin-top:clamp(3rem,9vh,6rem);
    display:flex;flex-direction:column;align-items:center;
    gap:clamp(1rem,2.6vh,1.7rem);
    width:100%;
  }
  .launch .rule{
    display:flex;align-items:center;justify-content:center;gap:.9rem;width:min(100%,780px);
  }
  .launch .rule::before,.launch .rule::after{
    content:"";flex:1;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold) 55%,var(--gold));
  }
  .launch .rule::after{background:linear-gradient(270deg,transparent,var(--gold) 55%,var(--gold))}
  .launch .rule i{
    width:7px;height:7px;transform:rotate(45deg);
    border:1px solid var(--gold);background:transparent;flex:none;
  }
  .launch h2{
    font-weight:700;
    text-transform:uppercase;
    font-size:clamp(1.6rem,5.6vw,3.8rem);
    line-height:1.05;
    letter-spacing:.2em;
    margin-right:-.2em;
    background:linear-gradient(180deg,#F6EBCB 0%,#D9C28C 48%,#B69A60 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 2px 14px rgba(18,30,21,.55)) drop-shadow(0 0 28px rgba(182,154,96,.28));
    animation:glow 5.5s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{filter:drop-shadow(0 2px 14px rgba(18,30,21,.55)) drop-shadow(0 0 22px rgba(182,154,96,.20))}
    50%{filter:drop-shadow(0 2px 14px rgba(18,30,21,.55)) drop-shadow(0 0 38px rgba(182,154,96,.42))}
  }

  /* ---------- Entrance animation ---------- */
  .reveal{opacity:0;transform:translateY(18px);animation:rise 1.4s cubic-bezier(.2,.7,.2,1) forwards}
  .d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
  @keyframes rise{to{opacity:1;transform:none}}

  /* ---------- Responsive tuning ---------- */
  @media (max-width:560px){
    .brand{letter-spacing:.05em;margin-right:-.05em}
    .farms{letter-spacing:.45em;margin-right:-.45em}
    .launch h2{letter-spacing:.12em;margin-right:-.12em;font-size:clamp(1.5rem,8.5vw,2.3rem)}
    .launch h2 span{display:block}
  }
  @media (max-height:520px) and (orientation:landscape){
    .brand{font-size:clamp(2.2rem,8vh,4rem)}
    .launch{margin-top:1.6rem}
    .tagline{margin-top:1rem}
  }
  @media (prefers-reduced-motion:reduce){
    .slide,.launch h2,.reveal{animation:none}
    .slide:nth-child(1){opacity:1}
    .reveal{opacity:1;transform:none}
  }
</style>
</head>
<body>

  <div class="scene" aria-hidden="true">
    <div class="slide"></div>
    <div class="slide"><div class="half a"></div><div class="half b"></div></div>
    <div class="slide"></div>
  </div>
  <div class="overlay" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main>
    <h1 class="reveal d1" style="all:unset;display:block;">
      <span class="brand" style="display:block;">Vyoma</span>
    </h1>

    <div class="farms-row reveal d2" aria-hidden="false">
      <span class="line"></span>
      <span class="farms">Farms</span>
      <span class="line r"></span>
    </div>

    <p class="tagline reveal d3">Engaged in Agriculture and LiveStock Farming</p>

    <section class="launch reveal d4">
      <div class="rule" aria-hidden="true"><i></i></div>
      <h2><span>Launching</span> <span>Soon</span></h2>
      <div class="rule" aria-hidden="true"><i></i></div>
    </section>
  </main>

</body>
</html>
